name: Daily Quant Bot with Memory

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
              python -m pip install --upgrade pip
              pip install yfinance pandas requests

      - name: Run Quant Bot
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
              python master_tg_bot.py

      - name: 💾 Commit and Push OpenClaw Memory
        run: |
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git diff --quiet && git diff --staged --quiet || (git commit -m "💾 自動更新小龍蝦記憶" && git push origin main)

      - name: ☁️ 安裝並設定 Rclone
        run: |
              sudo apt-get update
              sudo apt-get install -y rclone
              mkdir -p ~/.config/rclone
              echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: 🚀 同步資料到 Google Drive
        run: |
              rclone copy ./memory.json gdrive:OpenClaw_Bot_Data/
              rclone copy ./QUANT_INSIGHTS.md gdrive:OpenClaw_Bot_Data/
              echo "✅ 成功將最新記憶與戰報同步至 Google Drive！"
