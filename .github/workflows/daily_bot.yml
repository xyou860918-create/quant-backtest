name: Daily Quant Bot with Memory

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
              python -m pip install --upgrade pip
              pip install yfinance pandas requests

      - name: Run Quant Bot
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
              python master_tg_bot.py

      - name: 💾 Commit and Push OpenClaw Memory
        run: |
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add -A
              git diff --quiet && git diff --staged --quiet || (git commit -m "💾 自動更新小龍蝦記憶" && git push origin main)

      - name: ☁️ 安裝並設定 Rclone (Python 直接寫入)
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
              sudo apt-get update
              sudo apt-get install -y rclone
              mkdir -p ~/.config/rclone
              python3 -c "
              import os
              content = os.environ.get('RCLONE_CONF_DATA', '')
              path = os.path.expanduser('~/.config/rclone/rclone.conf')
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Successfully wrote {len(content)} chars to rclone.conf')
              "

      - name: 🚀 同步資料到 Google Drive
        run: |
              rclone copy . gdrive:OpenClaw_Bot_Data/ --include "*.py" --include "*.txt"
              echo "✅ 成功將最新程式碼與檔案同步至 Google Drive！"
