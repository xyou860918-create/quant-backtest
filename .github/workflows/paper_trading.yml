name: Paper Trading Daily Runner

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 美股盤後自動執行 (UTC 13:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴項
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 運行量化模擬交易 (TSLL / SOXL / TQQQ)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python paper_trader.py \
            --symbols TSLL SOXL TQQQ \
            --entry-period 20 \
            --exit-period 10 \
            --trailing-stop-pct 0.15 \
            --initial-cash 10000 \
            --fee-bps 10 \
            --slippage-bps 5

      - name: 提交和推送對帳單 Log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/logs/paper_trading/equity_*.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "📊 模擬交易淨值更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "無淨值變更，跳過 Commit"
          fi
