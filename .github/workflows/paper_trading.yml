name: Paper Trading Daily Runner

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 檢出儲存庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴項
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 運行紙上交易
        run: |
          python paper_trader.py \
            --symbols SOXX QQQ SPY \
            --donchian-strategy \
            --entry-period 20 \
            --exit-period 10 \
            --initial-cash 10000 \
            --fee-bps 5 \
            --slippage-bps 5

      - name: 提交和推送日誌
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/logs/paper_trading/equity_*.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "📊 模擬交易更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "無需提交任何更改"
          fi

      - name: Telegram 通知
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python -c "import os, requests, datetime; t=os.environ['TELEGRAM_TOKEN']; c=os.environ['TELEGRAM_CHAT_ID']; requests.post(f'https://api.telegram.org/bot{t}/sendMessage', json={'chat_id': c, 'text': f'📊 模擬交易完成 — {datetime.date.today()}\n詳情請查看 GitHub Actions。'})"
          else
            echo "未偵測到 TELEGRAM_TOKEN 或 TELEGRAM_CHAT_ID，跳過 Telegram 發送。"
          fi
